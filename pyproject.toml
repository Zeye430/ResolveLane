[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resolvelane"
version = "0.1.0"
description = "AI-powered support operations for digital marketplaces"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.0,<3.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]
# Offline embedding tier. Its runtime (onnxruntime) supports Python up to 3.14 at the moment.
local-embedding = [
    "fastembed>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
