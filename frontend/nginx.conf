# Serves the built web interface and forwards the API under the same origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The API's address is resolved when a request arrives, so nginx starts even before the API does.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A chat message waits for the language model; the browser gives up after 90 seconds.
        proxy_read_timeout 120s;
        client_max_body_size 64k;
    }

    # API documentation, for a look at the contract.
    location ~ ^/(health|docs|openapi\.json)$ {
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    # Written at start-up only when RESOLVELANE_DEMO_SIGN_IN is on (docker/40-demo-accounts.sh);
    # otherwise 404, and the sign-in page asks for a token.
    location = /demo-accounts.json {
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        try_files /demo-accounts.json =404;
    }

    # Built files carry a content hash in their names, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        try_files $uri /index.html;
    }
}
